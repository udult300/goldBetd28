workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60

    environment:
      vars:
        APP_NAME: "ScaffaleLievito"
        VERSION_NAME: "v1"
      java: 17

    scripts:
      - name: Give permission to gradlew
        script: chmod +x gradlew

      - name: Clean project
        script: ./gradlew clean

      - name: Build APK
        script: ./gradlew assembleRelease

      - name: Build AAB
        script: ./gradlew bundleRelease

      - name: Rename artifacts
        script: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          NEW_APK_NAME=${APP_NAME}-release-${VERSION_NAME}.apk
          NEW_AAB_NAME=${APP_NAME}-release-${VERSION_NAME}.aab

          cp $APK_PATH $NEW_APK_NAME
          cp $AAB_PATH $NEW_AAB_NAME

    artifacts:
      - ScaffaleLievito-release-v1.apk
      - ScaffaleLievito-release-v1.aab
